[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trained-without-consciousness"
version = "0.1.0"
description = "Reproducible experiment code for Trained Without Consciousness."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pyyaml>=6.0",
  "regex>=2024.11.6",
  "xxhash>=3.0",
]

[project.optional-dependencies]
data = [
  "aiohttp>=3.9",
  "datasets>=2.18",
  "fsspec>=2024.2",
  "huggingface-hub>=0.23",
  "tokenizers>=0.15",
  "tqdm>=4.66",
  "pyarrow>=15.0",
  "zstandard>=0.22",
]
filter = [
  "scikit-learn>=1.4",
  "sentence-transformers>=2.6",
  "fasttext-wheel>=0.9.2",
  "hnswlib>=0.8",
]
train = [
  "transformers>=4.45",
  "torch>=2.1",
  "numpy>=1.24",
  "safetensors>=0.4",
]
dashboard = [
  "streamlit>=1.34",
  "pandas>=2.2",
  "plotly>=5.20",
]

[dependency-groups]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["twc*"]
