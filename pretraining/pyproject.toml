[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trained-without-consciousness"
version = "0.1.0"
description = "Reproducible experiment code for Trained Without Consciousness."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pyyaml>=6.0",
  "regex>=2024.11.6",
  "xxhash>=3.0",
  "zstandard>=0.22",
]

[project.scripts]
twc-data = "twc.pretraining.data_pipeline.cli:main"
twc-pretrain = "twc.pretraining.training.cli:main"

[project.optional-dependencies]
data = [
  "aiohttp>=3.9",
  "datasets>=2.18",
  "fsspec>=2024.2",
  "huggingface-hub>=0.23",
  "tokenizers==0.22.2",
  "tqdm>=4.66",
  "pyarrow>=15.0",
]
filter = [
  "scikit-learn>=1.4",
  "sentence-transformers>=2.6",
  "fasttext-wheel>=0.9.2",
  "hnswlib>=0.8",
]
train = [
  "torch==2.12.0",
]
dashboard = [
  "streamlit>=1.34",
  "pandas>=2.2",
  "plotly>=5.20",
]

[dependency-groups]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["training"]
include = ["twc*"]
